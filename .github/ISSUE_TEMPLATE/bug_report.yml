name: Bug Report
description: Report a Tempo Desktop bug
title: "[Bug]: "
labels: "bug"
body:
- type: checkboxes
  attributes:
    label: Preflight Checklist
    description: Please ensure you have completed all of the following.
    options:
      - label: I am using the latest version of Tempo Desktop.
        required: true
      - label: I have checked existing issues for a matching bug report.
        required: true
      - label: I understand that Tempo Desktop has no affiliation with Google, YouTube, or Spotify.
        required: true
- type: input
  id: app-version
  attributes:
    label: Tempo Desktop Version
    description: What version of Tempo Desktop are you using?
    placeholder: 0.0.1
  validations:
    required: true
- type: dropdown
  id: package-type
  attributes:
    label: Distribution Format
    options:
      - Portable (.exe)
      - Installer (Setup .exe)
      - ZIP Archive (Unpacked)
      - Built from source
  validations:
    required: true
- type: input
  id: os-version
  attributes:
    label: Windows Version
    description: Which Windows version are you running (e.g. Windows 11 24H2 x64)?
    placeholder: "Windows 11 x64"
  validations:
    required: true
- type: textarea
  attributes:
    label: Reproduction Steps
    description: Provide steps to reproduce the issue.
    placeholder: "1. Open Tempo Desktop..."
  validations:
    required: true
- type: textarea
  attributes:
    label: Expected Behavior
    description: Describe what you expected to happen.
  validations:
    required: true
- type: textarea
  attributes:
    label: Actual Behavior
    description: Describe what actually happened.
  validations:
    required: true
- type: textarea
  attributes:
    label: Additional Information
    description: Add logs, screenshots, or enabled plugins/settings if helpful.
  validations:
    required: false

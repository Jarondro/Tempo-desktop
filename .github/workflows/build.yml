name: Build Tempo Desktop (Windows x64)

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish built artifacts as a GitHub Release'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Release tag name (e.g. v0.0.1), used when create_release=true'
        required: false
        default: ''
        type: string

permissions:
  contents: write

env:
  NODE_VERSION: "24.x"

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 12
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & Typecheck
        run: |
          pnpm lint
          pnpm typecheck

      - name: Build Spotify WebView2 Host & Electron App
        run: |
          pnpm build:spotify
          pnpm build

      - name: Package Windows x64 (Installer + Portable EXE + Unpacked)
        run: pnpm exec electron-builder --win --x64 -p never

      - name: Archive Portable ZIP
        shell: pwsh
        run: |
          Copy-Item -LiteralPath license -Destination 'pack/win-unpacked/LICENSE-Pear.txt' -Force
          Copy-Item -LiteralPath README.md -Destination 'pack/win-unpacked/README.md' -Force
          Compress-Archive -Path 'pack/win-unpacked/*' -DestinationPath 'pack/Tempo-Desktop-win-x64.zip' -Force

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tempo-desktop-win-x64
          path: |
            pack/Tempo-Desktop-Setup-*.exe
            pack/Tempo-Desktop-Portable-*.exe
            pack/Tempo-Desktop-win-x64.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $inputTag = '${{ inputs.release_tag }}'.Trim()
            if ($inputTag) {
              $tag = $inputTag
            } else {
              $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
              $tag = "v$ver"
            }
          }
          $files = @(Get-ChildItem pack -File | Where-Object {
            $_.Name -like 'Tempo-Desktop-*.exe' -or $_.Name -eq 'Tempo-Desktop-win-x64.zip'
          } | ForEach-Object { $_.FullName })
          if (-not $files.Count) { throw 'No release files were produced.' }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --target '${{ github.sha }}' --title "Tempo Desktop $tag" --generate-notes
          }
